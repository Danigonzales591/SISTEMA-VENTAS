<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas - Sistema de Ventas</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <header>
        <h1>SISTEMA DE VENTAS</h1>
        <p>Registro y control de ventas</p>
    </header>

    <nav class="menu">
        <a href="inicio.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="clientes.html">Clientes</a>
        <a href="ventas.html">Ventas</a>
        <a href="../index.html">Cerrar sesión</a>
    </nav>

    <main class="panel">
        <section>
            <h2>Registrar venta</h2>

            <form id="formVentas">
                <label>Nombre del cliente:</label>
                <input type="text" id="clienteVenta" required>

                <label>Producto:</label>
                <input type="text" id="productoVenta" required>

                <label>Cantidad:</label>
                <input type="number" id="cantidadVenta" min="1" required>

                <label>Precio unitario (Bs):</label>
                <input type="number" id="precioVenta" min="0.01" step="0.01" required>

                <button type="submit">Registrar venta</button>
            </form>

            <p id="mensajeVenta"></p>
        </section>

        <section>
            <h2>Lista de ventas</h2>

            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Total (Bs)</th>
                    </tr>
                </thead>
                <tbody id="listaVentas"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Proyecto académico - Diseño y Programación Web I</p>
    </footer>

    <script src="../js/ventas.js"></script>
</body>
</html>
